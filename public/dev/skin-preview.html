<!doctype html>
<!--
  public/dev/skin-preview.html — dev harness for 小人预览 (public/js/ui/skinPreview.js, docs/SKINS.md 小人预览).

  It mounts the real `SkinModelPreview` on a REAL manifest: `fetch('/data/assets.json')` → `data.setContent`, so
  `previewEntry(data.get('assets'), charId, skinId)` sees the same shape a battle does, and the module's own lazy
  imports (`render/app/pixi.js` → /vendor/pixi.min.js + /vendor/pixi-spine.js, and `assets.spine.acquire(entry)`)
  run against the real downloaded art under `public/assets/`.

  The page is the shell only: the mounting code lives in ./skin-preview.js, because this server's CSP (script-src
  'self' + the app's own inline-script hashes) refuses an inline module here — public/dev/fx-viewer.html pairs with
  fx-viewer.js the same way. Dev pages never ship (tools/package.mjs NOT_TRACKED_SHIP), so both files are free to
  exist for the browser test (`test/render/skin-preview.browser.test.js`) and for hand-checking a model.

  Query:  ?char=<charId>&skin=<skinId>
          the default char is char_498_inside (the docs' operator, front+back on disk) else the first manifest
          record with `spine.front.skel`; `skin` picks one of the record's own `skins` (a cosmetic plugin's overlay
          writes those — the committed manifest carries none).

  Hooks (driven by the browser test):
    window.__skinPreview = { ready, error, manifest, entry, charId, skinId,
                             show(charId, skinId?) → re-render with another operator/skin,
                             clear()                → unmount the component,
                             state()                → what the DOM currently shows }
  A model that cannot load is NOT an error here: the component keeps the static art (none, art=null) and its caption
  says 模型不可用 — `state().note` is how the test tells the two apart.
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>Skin preview · 卫戍协议：盟约</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="/fonts/fonts.css" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/components.css" />
  <link rel="stylesheet" href="/css/screens/loadout.css" />
  <style>
    html, body { margin: 0; min-height: 100%; background: #0a0e0d; color: #c3cbc7; font: 13px/1.4 "Noto Sans SC", system-ui, sans-serif; }
    .sp-dev { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 12px 40px; }
    .sp-dev__bar { font: 11px/1 Bender, Oxanium, monospace; letter-spacing: .08em; color: #4ed8af; text-transform: uppercase; }
    .sp-dev__status { font: 12px/1.4 ui-monospace, monospace; color: #8a948f; }
    .sp-dev__status.is-bad { color: #e0796a; }
    .sp-dev__hint { max-width: 40rem; color: #8a948f; font-size: 12px; text-align: center; }
    #app { display: flex; justify-content: center; }
  </style>
</head>
<body>
  <div class="sp-dev">
    <div class="sp-dev__bar">Skin model preview · dev</div>
    <div id="app"></div>
    <div class="sp-dev__status" id="status">loading…</div>
    <div class="sp-dev__hint">
      ?char=&lt;charId&gt;&amp;skin=&lt;skinId&gt; · hooks: window.__skinPreview.show(charId[, skinId]) / .clear() / .state()
    </div>
  </div>
  <script type="module" src="./skin-preview.js"></script>
</body>
</html>
